name: Verify production DB access

# Manual, read-only check of the production migration path: approval gate, Azure login, the
# environment secrets, the firewall opening for this runner, and database access. It lists
# migrations (applied vs pending) and writes nothing. Output is deliberately generic because the
# repository and its Actions logs are public.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log into Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Open SQL firewall for this runner
        uses: ./.github/actions/prod-sql
        with:
          mode: open
          connection-string: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          resource-group: ${{ secrets.PROD_SQL_RESOURCE_GROUP }}

      - name: Read the migration history (read-only)
        uses: ./.github/actions/prod-sql
        with:
          mode: wait
          connection-string: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          resource-group: ${{ secrets.PROD_SQL_RESOURCE_GROUP }}

      - name: Close SQL firewall
        if: always()
        uses: ./.github/actions/prod-sql
        with:
          mode: close
          connection-string: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          resource-group: ${{ secrets.PROD_SQL_RESOURCE_GROUP }}
