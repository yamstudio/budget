name: Verify production DB access

# Manual, read-only check of the production migration path: approval gate, Azure login, the
# environment secret, and database access. It lists migrations (applied vs pending) and writes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log into Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List migrations (read-only)
        env:
          PROD_DB_CONNECTION: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          BUDGET_ALLOW_REMOTE_DB: '1'
        shell: bash
        run: |
          dotnet tool restore
          dotnet restore src/WebApi
          # `migrations list` swallows connection errors (prints a warning, still lists migrations, exits 0),
          # so capture stdout+stderr and fail on that warning. Capturing first also keeps a crash from being
          # hidden by a pipe.
          out="$(dotnet ef migrations list --project src/WebApi --connection "$PROD_DB_CONNECTION" 2>&1)"
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -qE "An error occurred while accessing the database|Pending status not shown" <<< "$out"; then
            echo "Could not read the migration history from the database"; exit 1
          fi
          # Prove we really read the history, not just that nothing crashed.
          grep -q "InitialCreate" <<< "$out"
