name: Build and deploy Budget app to Azure

env:
  AZURE_WEBAPP_NAME: belfastweb
  # The built app, downloaded into its own directory: never deploy '.', which also holds the checkout.
  AZURE_WEBAPP_PACKAGE_PATH: 'artifact'
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '26.x'

# Merging to master does NOT deploy. Production deploys when a GitHub Release is published (tag v*), or
# when this workflow is run by hand from a v* tag (rollback / re-run). See docs/releasing.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Only merged, CI-verified code may reach production: the ref must be a v* tag on master's history.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require a v* tag that is part of master
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v[0-9]* ]]; then
            echo "Production deploys run only from v* tags (got $GITHUB_REF). Publish a release or choose a tag in 'Use workflow from'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $GITHUB_REF_NAME is not on master's history. Tag a commit that was merged to master."
            exit 1
          fi
          echo "Deploying $GITHUB_REF_NAME ($GITHUB_SHA)" | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish src/WebApi -c Release --property:PublishDir=${PWD}/artifact
      
      - name: Build UI
        run: npm --prefix src/UI ci && npm --prefix src/UI run build

      - name: Copy UI dist into artifact
        run: mkdir artifact/static && cp -r src/UI/dist/* artifact/static 

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: budget
          path: artifact/
          if-no-files-found: error

  # What does this release change, compared with the previous release tag? Drives the two approval-gated jobs below:
  # `infra` runs only if infra/ changed, `migrate` only if EF migrations changed. Also lists what is in the release
  # and, for a schema change, publishes the exact SQL for review.
  changes:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      has_migrations: ${{ steps.diff.outputs.has_migrations }}
      has_infra: ${{ steps.diff.outputs.has_infra }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: What changed since the previous release?
        id: diff
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          {
            echo "### Release $GITHUB_REF_NAME"
            if [[ -n "$prev" ]]; then
              echo "Changes since $prev:"
              echo '```'
              git log --oneline "$prev..$GITHUB_SHA"
              echo '```'
            else
              echo "No previous release tag found; treating the schema and infrastructure as changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          changed() { [[ -z "$prev" ]] || ! git diff --quiet "$prev" "$GITHUB_SHA" -- "$1"; }
          if changed src/WebApi/Migrations; then echo "has_migrations=true" >> "$GITHUB_OUTPUT"; else echo "has_migrations=false" >> "$GITHUB_OUTPUT"; fi
          if changed infra; then echo "has_infra=true" >> "$GITHUB_OUTPUT"; else echo "has_infra=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@v5
        if: steps.diff.outputs.has_migrations == 'true'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate the idempotent migration script for review
        if: steps.diff.outputs.has_migrations == 'true'
        env:
          # Script generation never connects to a database; this dummy local value only satisfies the local-DB guard.
          ConnectionStrings__BudgetDbConnection: Server=127.0.0.1,1433;Database=unused
        shell: bash
        run: |
          dotnet tool restore
          dotnet restore src/WebApi
          dotnet ef migrations script --idempotent --project src/WebApi --output migrate.sql
          {
            echo "### Pending production migration"
            echo "Review the SQL below, then approve the **production-migrations** environment to apply it."
            echo '```sql'
            cat migrate.sql
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Applies Terraform (web app, plan, SQL server) as belfast-infra via GitHub OIDC. Runs only when infra/ changed since
  # the previous release, and only after a required reviewer approves the production-infra environment. It refuses to
  # delete or replace anything: such a change must be applied by hand. See docs/identities.md.
  infra:
    needs: [checks, changes]
    if: needs.changes.outputs.has_infra == 'true'
    runs-on: ubuntu-latest
    environment: production-infra
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.15'
          terraform_wrapper: false

      - uses: ./.github/actions/tf-config
        with:
          tf-vars: ${{ secrets.TF_VARS }}
          tf-backend: ${{ secrets.TF_BACKEND }}

      - name: Plan, check, apply
        working-directory: infra
        shell: bash
        run: |
          terraform init -input=false -no-color -backend-config=backend.hcl
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out="$RUNNER_TEMP/tfplan"
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then echo "No infrastructure changes."; exit 0; fi
          [[ $rc -eq 2 ]] || { echo "terraform plan failed."; exit 1; }
          deletes="$(terraform show -json "$RUNNER_TEMP/tfplan" | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')"
          [[ "$deletes" == "0" ]] || { echo "Refusing to delete or replace $deletes resource(s) from CI. Apply that change by hand."; exit 1; }
          terraform apply -input=false -no-color "$RUNNER_TEMP/tfplan"

  # Applies pending EF migrations to production as belfast-migrate. Runs only when migrations changed, and only after a
  # required reviewer approves the production-migrations environment (configured in GitHub settings).
  migrate:
    needs: [checks, changes, infra]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.has_migrations == 'true' }}
    runs-on: ubuntu-latest
    environment: production-migrations
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Exports PROD_DB_CONNECTION (passwordless) and PROD_SQL_RESOURCE_GROUP, with every value masked.
      - uses: ./.github/actions/tf-config
        with:
          tf-vars: ${{ secrets.TF_VARS }}
          tf-backend: ${{ secrets.TF_BACKEND }}

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Open SQL firewall for this runner
        uses: ./.github/actions/prod-sql
        with:
          mode: open
          connection-string: ${{ env.PROD_DB_CONNECTION }}
          resource-group: ${{ env.PROD_SQL_RESOURCE_GROUP }}

      # The OIDC token behind the login lives only a few minutes, so log in again right before the database work.
      - name: Log into Azure (fresh token)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Wait until the production database is reachable
        uses: ./.github/actions/prod-sql
        with:
          mode: wait
          connection-string: ${{ env.PROD_DB_CONNECTION }}
          resource-group: ${{ env.PROD_SQL_RESOURCE_GROUP }}

      - name: Apply migrations
        env:
          # The one sanctioned place that bypasses the local-database guard.
          BUDGET_ALLOW_REMOTE_DB: '1'
        shell: bash
        run: |
          echo "Restore point (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ). Point-in-time restore covers the last 7 days." | tee -a "$GITHUB_STEP_SUMMARY"
          dotnet tool restore
          dotnet restore src/WebApi
          dotnet ef database update --project src/WebApi --connection "$PROD_DB_CONNECTION"

      - name: Close SQL firewall
        if: always()
        uses: ./.github/actions/prod-sql
        with:
          mode: close
          connection-string: ${{ env.PROD_DB_CONNECTION }}
          resource-group: ${{ env.PROD_SQL_RESOURCE_GROUP }}

  # Publishes the app as belfast-deploy via GitHub OIDC (no publish profile, no stored credential).
  deploy:
    runs-on: ubuntu-latest
    # Run when infra and migrations were applied or not needed; never when anything upstream failed.
    needs: [build, infra, migrate]
    if: ${{ !failure() && !cancelled() }}
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout first: it wipes the workspace, so anything downloaded before it would be deleted.
      - uses: actions/checkout@v6

      # Exports the masked tenant and subscription ids (GitHub variables would print them in the public log).
      - uses: ./.github/actions/tf-config
        with:
          tf-vars: ${{ secrets.TF_VARS }}
          tf-backend: ${{ secrets.TF_BACKEND }}

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Download artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: budget
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Refuse to publish anything that is not the built app (a wrong package turns the site into a 404 while the
      # sign-in redirect still makes the smoke check pass).
      - name: Check the package before deploying
        shell: bash
        run: |
          pkg='${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'
          [[ -f "$pkg/static/index.html" ]] || { echo "The package has no built UI (static/index.html)."; exit 1; }
          ls "$pkg"/*.dll > /dev/null 2>&1 || { echo "The package has no application DLLs."; exit 1; }
          for bad in infra .github src docs .git; do
            [[ ! -e "$pkg/$bad" ]] || { echo "The package contains repository files ($bad); refusing to deploy."; exit 1; }
          done
          echo "Package looks like the built app."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Smoke check (app is up; sign-in redirect counts as up)
        env:
          URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          for i in {1..20}; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || true)"
            case "$code" in
              200|301|302|401|403) echo "App is up (HTTP $code)"; exit 0 ;;
            esac
            echo "Attempt $i: HTTP $code"; sleep 10
          done
          echo "App did not come up after deploy"; exit 1
