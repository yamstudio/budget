name: CI

# Required checks. Runs on pull requests, and is reused by deploy.yml before any deploy.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '26.x'

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build (warnings are errors, includes NuGet vulnerability audit)
        run: dotnet build --configuration Release -warnaserror
      - name: Check formatting
        run: dotnet format --verify-no-changes
      - name: Start a throwaway SQL Server for the integration tests
        run: |
          pw="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')aA1!"
          echo "::add-mask::$pw"
          docker run -d --name sql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$pw" mcr.microsoft.com/mssql/server:2022-latest
          echo "ConnectionStrings__BudgetDbConnection=Server=127.0.0.1,1433;Database=Budget;User Id=sa;Password=$pw;TrustServerCertificate=True" >> "$GITHUB_ENV"
          for i in {1..90}; do
            if [[ "$(docker logs sql 2>&1)" == *"ready for client connections"* ]]; then exit 0; fi
            sleep 2
          done
          docker logs sql; exit 1
      - name: API integration tests (real SQL Server, real migrations)
        run: dotnet test --project tests/WebApi.Tests --configuration Release

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/UI
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/UI/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npx prettier --check .
      - name: Build
        run: npm run build
